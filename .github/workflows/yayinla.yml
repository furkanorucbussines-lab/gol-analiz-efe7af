name: Siteyi güncelle

on:
  schedule:
    - cron: "0 5 * * 1"   # Pazartesi 08:00 (TR)
    - cron: "0 7 * * 5"   # Cuma 10:00 (TR) - hafta sonu maçları için
  workflow_dispatch:       # elle çalıştırmak için

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Raporu üret
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python gol_botu.py
          mkdir site
          cp rapor.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
